<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>習慣トラッカー</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #c7d2fe;
      --success: #10b981;
      --success-dark: #059669;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* ── Header ── */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      position: relative;
    }

    .app-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    .sync-badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 100px;
      font-weight: 500;
      transition: opacity 0.3s;
    }

    .sync-badge.saving  { background: #fef9c3; color: #854d0e; }
    .sync-badge.saved   { background: #dcfce7; color: #166534; }
    .sync-badge.offline { background: #fee2e2; color: #991b1b; }
    .sync-badge.hidden  { opacity: 0; pointer-events: none; }

    /* ── Loading overlay ── */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 100;
      transition: opacity 0.3s;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tab {
      flex: 1;
      padding: 9px 4px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      text-align: center;
      transition: all 0.18s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      -webkit-tap-highlight-color: transparent;
    }

    .tab.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    /* ── Habit name edit ── */
    .habit-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
      background: var(--card);
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid var(--border);
    }

    .habit-name-input {
      flex: 1;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      background: transparent;
      outline: none;
      color: var(--text);
      min-width: 0;
    }

    .edit-hint { font-size: 0.8rem; color: var(--text-muted); flex-shrink: 0; }

    /* ── Calendar navigation ── */
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .cal-nav-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .cal-nav-btn:active { background: var(--bg); }

    .cal-title { font-weight: 700; font-size: 1.05rem; }

    /* ── Calendar grid ── */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-day-name {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 4px 0;
    }

    .cal-day-name:nth-child(1) { color: #ef4444; }
    .cal-day-name:nth-child(7) { color: #3b82f6; }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.88rem;
      transition: background 0.15s, transform 0.1s;
      border: 2px solid transparent;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .cal-day:not(.empty):active { transform: scale(0.88); }

    .cal-day.done {
      background: var(--success);
      color: #fff;
      font-weight: 700;
    }

    .cal-day.done:hover { background: var(--success-dark); }

    .cal-day.today:not(.done) {
      border-color: var(--primary);
      font-weight: 700;
      color: var(--primary);
    }

    .cal-day.empty { cursor: default; }

    .cal-day:nth-child(7n+1):not(.empty):not(.done) { color: #ef4444; }
    .cal-day:nth-child(7n):not(.empty):not(.done)   { color: #3b82f6; }

    /* ── Stats ── */
    .stats { display: flex; gap: 10px; margin-top: 18px; }

    .stat {
      flex: 1;
      background: var(--card);
      border-radius: 12px;
      padding: 14px 8px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-value {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
    }

    .stat-label { font-size: 0.7rem; color: var(--text-muted); margin-top: 5px; }

    /* ── Export button ── */
    .btn-export {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text);
      font-weight: 500;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-export:hover  { background: var(--bg); }
    .btn-export:active { background: var(--border); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e293b;
      color: #fff;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 0.85rem;
      opacity: 0;
      transition: transform 0.25s, opacity 0.25s;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">データを読み込み中...</div>
  </div>

  <div class="app">
    <div class="app-header">
      <div class="app-title">習慣トラッカー</div>
      <div class="sync-badge hidden" id="syncBadge"></div>
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="habit-header">
      <input class="habit-name-input" id="habitName" type="text" maxlength="20" placeholder="習慣名">
      <span class="edit-hint">タップで編集</span>
    </div>

    <div class="cal-nav">
      <button class="cal-nav-btn" id="prevMonth">‹</button>
      <span class="cal-title" id="calTitle"></span>
      <button class="cal-nav-btn" id="nextMonth">›</button>
    </div>

    <div class="cal-grid" id="calGrid"></div>

    <div class="stats" id="stats"></div>

    <button class="btn-export" id="exportBtn">📥 記録を CSV でエクスポート</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ── Config ─────────────────────────────────────────────
    const API_URL     = '/api/data';
    const STORAGE_KEY = 'habit-tracker-v1';  // localStorage fallback / cache

    // ── State ──────────────────────────────────────────────
    let state        = null;
    let currentHabit = 0;
    let currentYear  = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let saveTimer    = null;
    let syncBadgeTimer = null;

    function defaultState() {
      return {
        habits: [
          { name: '習慣1', records: {} },
          { name: '習慣2', records: {} },
          { name: '習慣3', records: {} }
        ]
      };
    }

    // ── Load (API → localStorage fallback) ─────────────────
    async function loadState() {
      try {
        const res = await fetch(API_URL, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); // update cache
            return data;
          }
        }
      } catch (_) {}

      // fallback: localStorage cache
      try {
        const cached = localStorage.getItem(STORAGE_KEY);
        if (cached) {
          showSyncBadge('offline', 'オフライン (ローカルキャッシュ)');
          return JSON.parse(cached);
        }
      } catch (_) {}

      return defaultState();
    }

    // ── Save (debounced, API + localStorage cache) ──────────
    function scheduleSave() {
      clearTimeout(saveTimer);
      showSyncBadge('saving', '同期中...');
      saveTimer = setTimeout(doSave, 500);
    }

    async function doSave() {
      // always update local cache immediately
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state),
        });
        if (res.ok) {
          showSyncBadge('saved', '保存済み ✓', 2000);
          return;
        }
      } catch (_) {}

      showSyncBadge('offline', 'ローカル保存 (オフライン)');
    }

    function showSyncBadge(type, text, autoHideMs) {
      const el = document.getElementById('syncBadge');
      el.textContent = text;
      el.className = `sync-badge ${type}`;
      clearTimeout(syncBadgeTimer);
      if (autoHideMs) {
        syncBadgeTimer = setTimeout(() => el.classList.add('hidden'), autoHideMs);
      }
    }

    // ── Render ─────────────────────────────────────────────
    function render() {
      renderTabs();
      renderHabitName();
      renderCalendar();
      renderStats();
    }

    function renderTabs() {
      document.getElementById('tabs').innerHTML = state.habits.map((h, i) =>
        `<div class="tab${i === currentHabit ? ' active' : ''}" onclick="switchHabit(${i})">${esc(h.name)}</div>`
      ).join('');
    }

    function renderHabitName() {
      document.getElementById('habitName').value = state.habits[currentHabit].name;
    }

    function renderCalendar() {
      document.getElementById('calTitle').textContent =
        `${currentYear}年 ${currentMonth + 1}月`;

      const today    = new Date();
      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const lastDay  = new Date(currentYear, currentMonth + 1, 0).getDate();
      const records  = state.habits[currentHabit].records;
      const dayNames = ['日', '月', '火', '水', '木', '金', '土'];

      let html = dayNames.map(n => `<div class="cal-day-name">${n}</div>`).join('');
      for (let i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';

      for (let d = 1; d <= lastDay; d++) {
        const key    = dateKey(currentYear, currentMonth, d);
        const done   = !!records[key];
        const isToday = today.getFullYear() === currentYear &&
                        today.getMonth()    === currentMonth &&
                        today.getDate()     === d;
        const cls = ['cal-day', done ? 'done' : '', isToday ? 'today' : ''].filter(Boolean).join(' ');
        html += `<div class="${cls}" onclick="toggleDay(${d})">${d}</div>`;
      }

      document.getElementById('calGrid').innerHTML = html;
    }

    function renderStats() {
      const records = state.habits[currentHabit].records;
      const total   = Object.values(records).filter(Boolean).length;

      let streak = 0;
      const now = new Date();
      for (let i = 0; i < 730; i++) {
        const d = new Date(now);
        d.setDate(d.getDate() - i);
        if (records[dateKey(d.getFullYear(), d.getMonth(), d.getDate())]) streak++;
        else break;
      }

      const prefix     = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
      const monthCount = Object.entries(records).filter(([k, v]) => v && k.startsWith(prefix)).length;

      document.getElementById('stats').innerHTML = `
        <div class="stat">
          <div class="stat-value">${streak}</div>
          <div class="stat-label">🔥 連続日数</div>
        </div>
        <div class="stat">
          <div class="stat-value">${monthCount}</div>
          <div class="stat-label">📅 今月の達成</div>
        </div>
        <div class="stat">
          <div class="stat-value">${total}</div>
          <div class="stat-label">✅ 累計達成</div>
        </div>
      `;
    }

    // ── Actions ────────────────────────────────────────────
    function switchHabit(i) {
      currentHabit = i;
      render();
    }

    function toggleDay(d) {
      const key     = dateKey(currentYear, currentMonth, d);
      const records = state.habits[currentHabit].records;
      if (records[key]) {
        delete records[key];
        showToast('記録を取り消しました');
      } else {
        records[key] = true;
        showToast('記録しました ✓');
      }
      scheduleSave();
      render();
    }

    document.getElementById('habitName').addEventListener('change', e => {
      const val = e.target.value.trim();
      state.habits[currentHabit].name = val || `習慣${currentHabit + 1}`;
      scheduleSave();
      renderTabs();
    });

    document.getElementById('prevMonth').onclick = () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      render();
    };

    document.getElementById('nextMonth').onclick = () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      render();
    };

    document.getElementById('exportBtn').onclick = exportCSV;

    function exportCSV() {
      const allDates = new Set();
      state.habits.forEach(h => Object.keys(h.records).forEach(k => allDates.add(k)));

      if (allDates.size === 0) { showToast('記録がまだありません'); return; }

      const headers = ['日付', ...state.habits.map(h => h.name)];
      const rows    = [...allDates].sort().map(date => [
        date,
        ...state.habits.map(h => h.records[date] ? '1' : '0')
      ]);

      const csv  = [headers, ...rows].map(r => r.join(',')).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = `habit-records-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('エクスポートしました 📥');
    }

    // ── Helpers ────────────────────────────────────────────
    function dateKey(y, m, d) {
      return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    let toastTimer;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
    }

    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Init ───────────────────────────────────────────────
    async function init() {
      state = await loadState();
      document.getElementById('loadingOverlay').classList.add('hidden');
      render();
    }

    init();
  </script>
</body>
</html>
