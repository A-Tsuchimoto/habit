name = "habit"
compatibility_date = "2026-04-09"
main = "worker.js"

# ローカル開発: npx wrangler dev
# 本番デプロイ: npx wrangler deploy

[assets]
directory = "."

# KV Namespace を作成したら下記のコメントを外して ID を入れる
# npx wrangler kv namespace create HABIT_DATA  ← これを実行すると ID が得られる
#
# [[kv_namespaces]]
# binding = "HABIT_DATA"
# id = "ここに実際のKV Namespace IDを入れる"
